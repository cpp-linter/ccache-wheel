name: Monitor ccache releases

# Check every day whether ccache has a release newer than the one in
# ccache_version.txt, and open a pull request that updates it when it does.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.repository_owner == 'cpp-linter'
    runs-on: ubuntu-latest
    permissions:
      # push the branch and open the pull request
      contents: write
      pull-requests: write
    concurrency:
      group: update-ccache
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the latest ccache release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(cat ccache_version.txt)
          current=${current%%.post*}
          latest=$(gh api repos/ccache/ccache/releases/latest --jq .tag_name | sed 's/^v//')
          echo "Packaged: $current, latest upstream: $latest"
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected ccache release tag '$latest'."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "Up to date."
            exit 0
          fi
          echo "$latest" > ccache_version.txt
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.latest.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: update-ccache
          delete-branch: true
          commit-message: "feat: update ccache to ${{ steps.latest.outputs.version }}"
          title: "feat: update ccache to ${{ steps.latest.outputs.version }}"
          body: |
            ccache ${{ steps.latest.outputs.version }} is out. This sets `ccache_version.txt` to it.

            1. Close and reopen this pull request: GitHub does not start CI on a pull request
               that a workflow opened. The CI builds the wheels from the new release, checks
               the signatures of its files and tests the wheels.
            2. Merge it. The release draft becomes v${{ steps.latest.outputs.version }}.
            3. Publish the [draft release](${{ github.server_url }}/${{ github.repository }}/releases)
               to upload the wheels to PyPI.
