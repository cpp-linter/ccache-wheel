name: Upload Python Package

# Publishing the GitHub release drafted by Release Drafter uploads the wheels
# to PyPI. Running this workflow by hand on main uploads them to TestPyPI.
# Both run the full test workflow first.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish-testpypi:
    name: Publish to TestPyPI
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'cpp-linter'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ccache-bin/${{ needs.test.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: test
    if: github.event_name == 'release' && github.repository_owner == 'cpp-linter'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ccache-bin/${{ needs.test.outputs.version }}/
    permissions:
      contents: write # attach files to the release
      id-token: write # trusted publishing and build provenance attestations
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - name: Check the release tag
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match ccache_version.txt ($VERSION)"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      # Attach the wheels and the ccache source code to the release first,
      # so the source is available before the wheels are on PyPI.
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.whl release/* --clobber
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
